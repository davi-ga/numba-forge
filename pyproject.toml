[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "LLM as an intelligent compiler: build-time modularisation + Numba annotation for serverless Python. Runtime middleware lives in forge-middleware/."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "psutil",
]

[project.optional-dependencies]
build = [
    "google-genai",
    "python-dotenv",
    "pyflakes",
]

[project.scripts]
forge = "build_pipeline:main"

[tool.setuptools]
py-modules = ["build_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
